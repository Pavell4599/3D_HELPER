<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroCore UI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        
        <!-- ЛЕВАЯ ПОЛОВИНА: Панель Управления -->
        <section class="left-panel">
            <div class="glow-bg"></div>
            
            <header>
                <h1>NeuroCore <span class="version">PY</span></h1>
                <p>Python Backend Connected</p>
            </header>

            <div class="input-section">
                <label>Промпт для модели</label>
                <textarea 
                    id="prompt" 
                    placeholder="Введи запрос для нейросети..."
                ></textarea>

                <div id="error" class="error hidden"></div>

                <button id="generate-btn" onclick="handleGenerate()">
                    Запустить генерацию
                </button>
            </div>
        </section>

        <!-- ПРАВАЯ ПОЛОВИНА: Результат -->
        <section class="right-panel">
            <div class="grid-bg"></div>
            
            <div id="result-container" class="result-container">
                <div id="placeholder" class="placeholder">
                    <div class="pulse-dot"></div>
                    <p>Ready for Input</p>
                </div>

                <div id="result" class="result hidden">
                    <img id="result-image" src="" alt="Result">
                    <div class="status-bar">
                        <span id="status-text">STATUS: SUCCESS</span>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        // Функция генерации
        async function handleGenerate() {
            const prompt = document.getElementById('prompt').value.trim();
            const btn = document.getElementById('generate-btn');
            const errorDiv = document.getElementById('error');
            const placeholder = document.getElementById('placeholder');
            const result = document.getElementById('result');
            const resultImage = document.getElementById('result-image');
            const statusText = document.getElementById('status-text');

            if (!prompt) return;

            // Показываем загрузку
            btn.disabled = true;
            btn.textContent = 'Вычисление...';
            errorDiv.classList.add('hidden');
            placeholder.classList.add('hidden');
            result.classList.add('hidden');

            try {
                const response = await fetch('http://127.0.0.1:8000/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: prompt })
                });

                if (!response.ok) throw new Error('Ошибка соединения');

                const data = await response.json();
                
                // Показываем результат
                if (data.mock_url) {
                    resultImage.src = data.mock_url;
                    result.classList.remove('hidden');
                    statusText.textContent = `STATUS: ${data.status.toUpperCase()}`;
                } else {
                    throw new Error(data.message || 'Нет результата');
                }

            } catch (err) {
                errorDiv.textContent = 'Не удалось подключиться к Python. Запущен ли сервер?';
                errorDiv.classList.remove('hidden');
                placeholder.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Запустить генерацию';
            }
        }
    </script>
</body>
</html>
